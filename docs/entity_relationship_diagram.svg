<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Drop Shadow -->
    <filter id="er-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <!-- Arrow Markers -->
    <marker id="er-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="er-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="er-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="er-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#8b5cf6" />
    </marker>
    <marker id="er-arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ec4899" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="0" y="0" width="1600" height="70" fill="#1e293b" />
  <text x="50" y="44" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="0.5">Online Campus Complaints Management System (OCMS)</text>
  <text x="1550" y="44" fill="#38bdf8" font-size="14" font-weight="600" text-anchor="end">Entity-Relationship (ER) Diagram (3NF Normalized SQLite Database)</text>

  <!-- ================= ENTITY CARDS ================= -->

  <!-- 1. USERS (Top Center) -->
  <g transform="translate(600, 95)">
    <rect x="0" y="0" width="340" height="280" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#er-shadow)" />
    <rect x="0" y="0" width="340" height="38" rx="10" fill="#0369a1" />
    <text x="170" y="25" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">USERS</text>
    <text x="16" y="60" fill="#fbbf24" font-size="12" font-weight="700">id : INTEGER [PK]</text>
    <text x="16" y="80" fill="#f8fafc" font-size="12">email : VARCHAR(120) [UK, NOT NULL]</text>
    <text x="16" y="100" fill="#f8fafc" font-size="12">name : VARCHAR(100) [NOT NULL]</text>
    <text x="16" y="120" fill="#f8fafc" font-size="12">role : VARCHAR(20) [user|staff|admin]</text>
    <text x="16" y="140" fill="#f8fafc" font-size="12">phone : VARCHAR(20)</text>
    <text x="16" y="160" fill="#f8fafc" font-size="12">department : VARCHAR(100)</text>
    <text x="16" y="180" fill="#f8fafc" font-size="12">password_hash : VARCHAR(255)</text>
    <text x="16" y="200" fill="#f8fafc" font-size="12">is_active : BOOLEAN [DEFAULT 1]</text>
    <text x="16" y="220" fill="#f8fafc" font-size="12">failed_attempts : INTEGER [DEFAULT 0]</text>
    <text x="16" y="240" fill="#f8fafc" font-size="12">locked_until : DATETIME</text>
    <text x="16" y="260" fill="#f8fafc" font-size="12">created_at : DATETIME</text>
  </g>

  <!-- 2. DEPARTMENTS (Top Left) -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="300" height="120" rx="10" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" filter="url(#er-shadow)" />
    <rect x="0" y="0" width="300" height="38" rx="10" fill="#0284c7" />
    <text x="150" y="25" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">DEPARTMENTS</text>
    <text x="16" y="65" fill="#fbbf24" font-size="12" font-weight="700">id : INTEGER [PK]</text>
    <text x="16" y="90" fill="#f8fafc" font-size="12">name : VARCHAR(100) [UK, NOT NULL]</text>
  </g>

  <!-- 3. CATEGORIES (Middle Left) -->
  <g transform="translate(100, 480)">
    <rect x="0" y="0" width="320" height="210" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2" filter="url(#er-shadow)" />
    <rect x="0" y="0" width="320" height="38" rx="10" fill="#047857" />
    <text x="160" y="25" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">CATEGORIES</text>
    <text x="16" y="65" fill="#fbbf24" font-size="12" font-weight="700">id : INTEGER [PK]</text>
    <text x="16" y="88" fill="#f8fafc" font-size="12">name : VARCHAR(100) [UK, NOT NULL]</text>
    <text x="16" y="111" fill="#f8fafc" font-size="12">description : TEXT</text>
    <text x="16" y="134" fill="#f8fafc" font-size="12">sla_hours : INTEGER [DEFAULT 48]</text>
    <text x="16" y="157" fill="#f8fafc" font-size="12">icon : VARCHAR(50)</text>
    <text x="16" y="180" fill="#f8fafc" font-size="12">is_active : BOOLEAN [DEFAULT 1]</text>
    <text x="16" y="200" fill="#f8fafc" font-size="12">default_priority : VARCHAR(20)</text>
  </g>

  <!-- 4. COMPLAINTS (Central Entity) -->
  <g transform="translate(560, 440)">
    <rect x="0" y="0" width="420" height="400" rx="10" fill="#182234" stroke="#f59e0b" stroke-width="2.5" filter="url(#er-shadow)" />
    <rect x="0" y="0" width="420" height="40" rx="10" fill="#b45309" />
    <text x="210" y="26" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">COMPLAINTS</text>
    
    <text x="18" y="65" fill="#fbbf24" font-size="12" font-weight="700">id : INTEGER [PK]</text>
    <text x="18" y="85" fill="#f8fafc" font-size="12">tracking_number : VARCHAR(30) [UK, NOT NULL]</text>
    <text x="18" y="105" fill="#38bdf8" font-size="12" font-weight="600">user_id : INTEGER [FK -&gt; users.id, NOT NULL]</text>
    <text x="18" y="125" fill="#34d399" font-size="12" font-weight="600">category_id : INTEGER [FK -&gt; categories.id, NOT NULL]</text>
    <text x="18" y="145" fill="#7dd3fc" font-size="12" font-weight="600">department_id : INTEGER [FK -&gt; departments.id]</text>
    <text x="18" y="165" fill="#38bdf8" font-size="12" font-weight="600">assigned_to : INTEGER [FK -&gt; users.id, NULLABLE]</text>
    <text x="18" y="185" fill="#f8fafc" font-size="12">title : VARCHAR(200) [NOT NULL]</text>
    <text x="18" y="205" fill="#f8fafc" font-size="12">description : TEXT [NOT NULL]</text>
    <text x="18" y="225" fill="#f8fafc" font-size="12">location : VARCHAR(200)</text>
    <text x="18" y="245" fill="#f8fafc" font-size="12">priority : VARCHAR(20) [Low|Medium|High|Urgent]</text>
    <text x="18" y="265" fill="#f8fafc" font-size="12">status : VARCHAR(30) [Submitted|Assigned|...]</text>
    <text x="18" y="285" fill="#f8fafc" font-size="12">attachment_path : VARCHAR(255)</text>
    <text x="18" y="305" fill="#f8fafc" font-size="12">is_anonymous : BOOLEAN [DEFAULT 0]</text>
    <text x="18" y="325" fill="#c084fc" font-size="12">parent_id : INTEGER [FK -&gt; complaints.id, Merged]</text>
    <text x="18" y="345" fill="#f8fafc" font-size="12">rejection_reason : TEXT</text>
    <text x="18" y="365" fill="#f8fafc" font-size="12">created_at, updated_at : DATETIME</text>
    <text x="18" y="385" fill="#f8fafc" font-size="12">due_at, resolved_at : DATETIME</text>
  </g>

  <!-- 5. COMPLAINT_UPDATES (Bottom Left) -->
  <g transform="translate(100, 890)">
    <rect x="0" y="0" width="340" height="210" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="2" filter="url(#er-shadow)" />
    <rect x="0" y="0" width="340" height="38" rx="10" fill="#6d28d9" />
    <text x="170" y="25" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">COMPLAINT_UPDATES</text>
    <text x="16" y="65" fill="#fbbf24" font-size="12" font-weight="700">id : INTEGER [PK]</text>
    <text x="16" y="88" fill="#f59e0b" font-size="12" font-weight="600">complaint_id : INTEGER [FK -&gt; complaints.id, CASCADE]</text>
    <text x="16" y="111" fill="#38bdf8" font-size="12" font-weight="600">updated_by : INTEGER [FK -&gt; users.id]</text>
    <text x="16" y="134" fill="#f8fafc" font-size="12">old_status : VARCHAR(30)</text>
    <text x="16" y="157" fill="#f8fafc" font-size="12">new_status : VARCHAR(30)</text>
    <text x="16" y="180" fill="#f8fafc" font-size="12">remark : TEXT [NOT NULL]</text>
    <text x="16" y="200" fill="#f8fafc" font-size="12">created_at : DATETIME</text>
  </g>

  <!-- 6. FEEDBACK (Bottom Right) -->
  <g transform="translate(1120, 890)">
    <rect x="0" y="0" width="340" height="190" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2" filter="url(#er-shadow)" />
    <rect x="0" y="0" width="340" height="38" rx="10" fill="#d97706" />
    <text x="170" y="25" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">FEEDBACK</text>
    <text x="16" y="65" fill="#fbbf24" font-size="12" font-weight="700">id : INTEGER [PK]</text>
    <text x="16" y="88" fill="#f59e0b" font-size="12" font-weight="600">complaint_id : INTEGER [FK, UNIQUE, CASCADE]</text>
    <text x="16" y="111" fill="#38bdf8" font-size="12" font-weight="600">user_id : INTEGER [FK -&gt; users.id]</text>
    <text x="16" y="134" fill="#f8fafc" font-size="12">rating : INTEGER [1 to 5 Stars, NOT NULL]</text>
    <text x="16" y="157" fill="#f8fafc" font-size="12">comment : TEXT</text>
    <text x="16" y="178" fill="#f8fafc" font-size="12">created_at : DATETIME</text>
  </g>

  <!-- 7. NOTIFICATIONS (Middle Right) -->
  <g transform="translate(1120, 520)">
    <rect x="0" y="0" width="340" height="170" rx="10" fill="#1e293b" stroke="#ec4899" stroke-width="2" filter="url(#er-shadow)" />
    <rect x="0" y="0" width="340" height="38" rx="10" fill="#be185d" />
    <text x="170" y="25" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">NOTIFICATIONS</text>
    <text x="16" y="65" fill="#fbbf24" font-size="12" font-weight="700">id : INTEGER [PK]</text>
    <text x="16" y="88" fill="#38bdf8" font-size="12" font-weight="600">user_id : INTEGER [FK -&gt; users.id, NOT NULL]</text>
    <text x="16" y="111" fill="#f59e0b" font-size="12" font-weight="600">complaint_id : INTEGER [FK -&gt; complaints.id]</text>
    <text x="16" y="134" fill="#f8fafc" font-size="12">message : VARCHAR(255) [NOT NULL]</text>
    <text x="16" y="155" fill="#f8fafc" font-size="12">is_read : BOOLEAN [DEFAULT 0]</text>
  </g>

  <!-- 8. AUDIT_LOGS (Top Right) -->
  <g transform="translate(1120, 150)">
    <rect x="0" y="0" width="340" height="180" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2" filter="url(#er-shadow)" />
    <rect x="0" y="0" width="340" height="38" rx="10" fill="#475569" />
    <text x="170" y="25" fill="#ffffff" font-size="15" font-weight="800" text-anchor="middle">AUDIT_LOGS</text>
    <text x="16" y="65" fill="#fbbf24" font-size="12" font-weight="700">id : INTEGER [PK]</text>
    <text x="16" y="88" fill="#38bdf8" font-size="12" font-weight="600">user_id : INTEGER [FK -&gt; users.id]</text>
    <text x="16" y="111" fill="#f8fafc" font-size="12">action : VARCHAR(100) [NOT NULL]</text>
    <text x="16" y="134" fill="#f8fafc" font-size="12">target_id : VARCHAR(50)</text>
    <text x="16" y="155" fill="#f8fafc" font-size="12">ip_address : VARCHAR(50)</text>
  </g>

  <!-- ================= RELATIONSHIP CONNECTORS & CARDINALITY LABELS ================= -->

  <!-- 1. users -> complaints (user_id 1:N) -->
  <path d="M 720 375 L 720 440" fill="none" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#er-arrow)" />
  <rect x="725" y="395" width="85" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="767" y="411" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">1 : N (files)</text>

  <!-- 2. users -> complaints (assigned_to 0..1:N) -->
  <path d="M 820 375 L 820 440" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#er-arrow)" />
  <rect x="825" y="395" width="95" height="22" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="872" y="411" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">0..1:N (assign)</text>

  <!-- 3. categories -> complaints (category_id 1:N) -->
  <path d="M 420 580 L 560 580" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#er-arrow-green)" />
  <rect x="445" y="555" width="90" height="22" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1" />
  <text x="490" y="571" fill="#6ee7b7" font-size="11" font-weight="700" text-anchor="middle">1 : N (classifies)</text>

  <!-- 4. complaints -> complaint_updates (complaint_id 1:N) -->
  <path d="M 640 840 L 640 980 L 440 980" fill="none" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#er-arrow-purple)" />
  <rect x="520" y="965" width="95" height="22" rx="4" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" />
  <text x="567" y="981" fill="#c4b5fd" font-size="11" font-weight="700" text-anchor="middle">1 : N (timeline)</text>

  <!-- 5. complaints -> feedback (complaint_id 1:1) -->
  <path d="M 900 840 L 900 980 L 1120 980" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#er-arrow-amber)" />
  <rect x="940" y="965" width="85" height="22" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
  <text x="982" y="981" fill="#fde68a" font-size="11" font-weight="700" text-anchor="middle">1 : 1 (rating)</text>

  <!-- 6. users -> notifications (user_id 1:N) -->
  <path d="M 940 220 L 1120 220" fill="none" stroke="#ec4899" stroke-width="2.5" marker-end="url(#er-arrow-pink)" />
  <rect x="985" y="200" width="85" height="22" rx="4" fill="#0f172a" stroke="#ec4899" stroke-width="1" />
  <text x="1027" y="216" fill="#fbcfe8" font-size="11" font-weight="700" text-anchor="middle">1 : N (alerts)</text>

  <!-- 7. users -> audit_logs (user_id 0..1:N) -->
  <path d="M 940 280 L 1050 280 L 1050 310 L 1120 310" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#er-arrow)" />
  <rect x="985" y="295" width="85" height="22" rx="4" fill="#0f172a" stroke="#64748b" stroke-width="1" />
  <text x="1027" y="311" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">1 : N (audit)</text>

  <!-- 8. departments -> users (employs 1:N) -->
  <path d="M 400 210 L 600 210" fill="none" stroke="#0ea5e9" stroke-width="2" marker-end="url(#er-arrow)" />
  <rect x="450" y="195" width="95" height="22" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
  <text x="497" y="211" fill="#7dd3fc" font-size="11" font-weight="700" text-anchor="middle">1 : N (employs)</text>

  <!-- Bottom Notation Bar -->
  <rect x="50" y="1130" width="1500" height="40" rx="8" fill="#1e293b" />
  <text x="70" y="1155" fill="#94a3b8" font-size="12">
    <tspan fill="#38bdf8" font-weight="700">Crow's Foot Notation &amp; Rules:</tspan> PK = Primary Key | FK = Foreign Key | UK = Unique Constraint | 1:1 Unique Feedback | 1:N Cascading Updates | 3NF SQLite
  </text>
  <text x="1530" y="1155" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="end">OCMS IEEE Std 830-1998 Architecture</text>
</svg>
