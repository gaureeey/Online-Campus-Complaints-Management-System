<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <filter id="seq-shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <marker id="seq-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="seq-arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="seq-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="seq-arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="0" y="0" width="1400" height="70" fill="#1e293b" />
  <text x="40" y="44" fill="#ffffff" font-size="20" font-weight="700">Online Campus Complaints Management System (OCMS)</text>
  <text x="1360" y="44" fill="#38bdf8" font-size="14" font-weight="600" text-anchor="end">UML 2.5 Sequence Diagram (End-to-End Complaint Lifecycle)</text>

  <!-- Lifeline Headers -->
  <!-- 1. Complainant -->
  <g transform="translate(100, 95)">
    <rect x="0" y="0" width="150" height="46" rx="8" fill="#0369a1" stroke="#38bdf8" stroke-width="2" filter="url(#seq-shadow)" />
    <text x="75" y="28" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Student (Complainant)</text>
    <line x1="75" y1="46" x2="75" y2="840" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- 2. Web UI -->
  <g transform="translate(360, 95)">
    <rect x="0" y="0" width="150" height="46" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#seq-shadow)" />
    <text x="75" y="28" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Web Browser / UI</text>
    <line x1="75" y1="46" x2="75" y2="840" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- 3. OCMS Backend -->
  <g transform="translate(620, 95)">
    <rect x="0" y="0" width="160" height="46" rx="8" fill="#0f766e" stroke="#2dd4bf" stroke-width="2" filter="url(#seq-shadow)" />
    <text x="80" y="28" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Flask App Backend</text>
    <line x1="80" y1="46" x2="80" y2="840" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- 4. SQLite DB -->
  <g transform="translate(890, 95)">
    <rect x="0" y="0" width="150" height="46" rx="8" fill="#b45309" stroke="#fbbf24" stroke-width="2" filter="url(#seq-shadow)" />
    <text x="75" y="28" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">SQLite Database</text>
    <line x1="75" y1="46" x2="75" y2="840" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- 5. Staff Technician -->
  <g transform="translate(1140, 95)">
    <rect x="0" y="0" width="160" height="46" rx="8" fill="#047857" stroke="#34d399" stroke-width="2" filter="url(#seq-shadow)" />
    <text x="80" y="28" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Staff (Technician)</text>
    <line x1="80" y1="46" x2="80" y2="840" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,4" />
  </g>

  <!-- Lifeline Activation Boxes -->
  <rect x="170" y="170" width="10" height="650" fill="#0284c7" />
  <rect x="430" y="170" width="10" height="650" fill="#334155" />
  <rect x="695" y="170" width="10" height="650" fill="#0f766e" />
  <rect x="960" y="170" width="10" height="650" fill="#78350f" />
  <rect x="1215" y="380" width="10" height="440" fill="#047857" />

  <!-- Messages -->
  <!-- 1. Submit form -->
  <path d="M 180 185 L 430 185" stroke="#38bdf8" stroke-width="2" marker-end="url(#seq-arrow)" />
  <text x="305" y="175" fill="#bae6fd" font-size="11" font-weight="600" text-anchor="middle">1. POST /complaint/new (Category, Urgency='High', Photo)</text>

  <!-- 2. UI to Backend -->
  <path d="M 440 215 L 695 215" stroke="#38bdf8" stroke-width="2" marker-end="url(#seq-arrow)" />
  <text x="567" y="205" fill="#bae6fd" font-size="11" font-weight="600" text-anchor="middle">2. Forward CSRF &amp; Multipart Payload</text>

  <!-- 3. Save attachment & compute SLA -->
  <path d="M 705 240 C 760 240, 760 270, 705 270" stroke="#2dd4bf" stroke-width="2" fill="none" marker-end="url(#seq-arrow-green)" />
  <text x="765" y="260" fill="#ccfbf1" font-size="10">3. Save UUID Photo &amp; Compute SLA (12h)</text>

  <!-- 4. DB Insert -->
  <path d="M 705 295 L 960 295" stroke="#fbbf24" stroke-width="2" marker-end="url(#seq-arrow-amber)" />
  <text x="832" y="285" fill="#fde68a" font-size="11" font-weight="600" text-anchor="middle">4. INSERT INTO complaints (OCMS-2026-0042)</text>

  <!-- 5. DB OK -->
  <path d="M 960 325 L 705 325" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#seq-arrow-amber)" />
  <text x="832" y="318" fill="#fef08a" font-size="10" text-anchor="middle">5. 201 Created</text>

  <!-- 6. Confirmation to Student -->
  <path d="M 695 355 L 180 355" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#seq-arrow)" />
  <text x="437" y="348" fill="#bae6fd" font-size="11" font-weight="600" text-anchor="middle">6. Display Reference Token &amp; Target Due Date</text>

  <!-- Phase divider: Admin Assignment -->
  <rect x="150" y="380" width="1080" height="24" rx="4" fill="#1e293b" stroke="#334155" />
  <text x="690" y="396" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">PHASE 2: ADMINISTRATIVE TRIAGE &amp; TECHNICIAN ALLOCATION</text>

  <!-- 7. Assign Staff -->
  <path d="M 705 425 L 960 425" stroke="#fbbf24" stroke-width="2" marker-end="url(#seq-arrow-amber)" />
  <text x="832" y="415" fill="#fde68a" font-size="11" font-weight="600" text-anchor="middle">7. UPDATE complaints SET assigned_to=3, status='Assigned'</text>

  <!-- 8. Staff Notification -->
  <path d="M 705 455 L 1215 455" stroke="#34d399" stroke-width="2" marker-end="url(#seq-arrow-green)" />
  <text x="960" y="445" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">8. In-App Notification: New Work Order Allocated</text>

  <!-- Phase divider: Staff Execution -->
  <rect x="150" y="485" width="1080" height="24" rx="4" fill="#1e293b" stroke="#334155" />
  <text x="690" y="501" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">PHASE 3: FIELD REPAIR EXECUTION &amp; RESOLUTION</text>

  <!-- 9. Staff Starts Work -->
  <path d="M 1215 530 L 705 530" stroke="#34d399" stroke-width="2" marker-end="url(#seq-arrow-green)" />
  <text x="960" y="520" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">9. POST /update-status (status='In Progress')</text>

  <!-- 10. Staff Marks Resolved -->
  <path d="M 1215 570 L 705 570" stroke="#34d399" stroke-width="2" marker-end="url(#seq-arrow-green)" />
  <text x="960" y="560" fill="#a7f3d0" font-size="11" font-weight="600" text-anchor="middle">10. POST /update-status (status='Resolved', notes='Replaced MCB breaker')</text>

  <!-- 11. DB Commit Resolved -->
  <path d="M 705 600 L 960 600" stroke="#fbbf24" stroke-width="2" marker-end="url(#seq-arrow-amber)" />
  <text x="832" y="590" fill="#fde68a" font-size="11" font-weight="600" text-anchor="middle">11. UPDATE complaints SET resolved_at=NOW()</text>

  <!-- 12. Alert Complainant -->
  <path d="M 695 635 L 180 635" stroke="#38bdf8" stroke-width="2" marker-end="url(#seq-arrow)" />
  <text x="437" y="625" fill="#bae6fd" font-size="11" font-weight="600" text-anchor="middle">12. Notify Complainant: Resolved (Unlock Rating Form &amp; 7-Day Reopen)</text>

  <!-- Phase divider: Student Feedback -->
  <rect x="150" y="665" width="1080" height="24" rx="4" fill="#1e293b" stroke="#334155" />
  <text x="690" y="681" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">PHASE 4: CITIZEN SATISFACTION FEEDBACK &amp; TERMINAL CLOSURE</text>

  <!-- 13. Complainant Rates 5 Stars -->
  <path d="M 180 715 L 695 715" stroke="#c084fc" stroke-width="2" marker-end="url(#seq-arrow-purple)" />
  <text x="437" y="705" fill="#ede9fe" font-size="11" font-weight="600" text-anchor="middle">13. POST /complaint/OCMS-2026-0042/feedback (rating=5, comment='Great fix!')</text>

  <!-- 14. Insert Feedback & Close -->
  <path d="M 705 750 L 960 750" stroke="#fbbf24" stroke-width="2" marker-end="url(#seq-arrow-amber)" />
  <text x="832" y="740" fill="#fde68a" font-size="11" font-weight="600" text-anchor="middle">14. INSERT INTO feedback &amp; UPDATE status='Closed'</text>

  <!-- 15. Thank You Flash -->
  <path d="M 695 785 L 180 785" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#seq-arrow)" />
  <text x="437" y="775" fill="#bae6fd" font-size="11" font-weight="600" text-anchor="middle">15. Confirmation: "Thank you for rating our service!"</text>

  <!-- Bottom Legend -->
  <rect x="40" y="870" width="1320" height="35" rx="6" fill="#1e293b" />
  <text x="60" y="892" fill="#94a3b8" font-size="11">
    <tspan fill="#38bdf8" font-weight="700">Actors:</tspan> Complainant (Student), Flask Web Backend, SQLite Database, Field Technician | <tspan fill="#fbbf24" font-weight="700">Standards:</tspan> UML 2.5 Interaction Sequence
  </text>
</svg>
