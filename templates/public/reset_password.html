{% extends 'base.html' %}

{% block title %}Set New Password | OCMS{% endblock %}

{% block public_content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="ocms-card p-4 p-md-5 bg-white">
        <div class="text-center mb-4">
          <div class="bg-primary-subtle text-primary rounded-circle d-inline-flex p-3 fs-4 mb-2">
            <i class="bi bi-shield-lock"></i>
          </div>
          <h3 class="fw-bold text-dark">Set New Password</h3>
          <p class="text-muted small">Choose a strong password of at least 8 characters with at least one digit.</p>
        </div>

        <form action="{{ url_for('auth.reset_password', token=token) }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-3">
            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" class="form-control" id="newPassword" name="password" minlength="8" required placeholder="Minimum 8 characters with numbers">
          </div>

          <div class="mb-4">
            <label for="confirmPassword" class="form-label">Confirm New Password</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirm_password" minlength="8" required placeholder="Re-enter password">
          </div>

          <button type="submit" class="btn btn-primary w-100 py-2 mb-3 shadow-sm">
            Update Password
          </button>
        </form>

        <div class="text-center small text-muted">
          <a href="{{ url_for('login') }}" class="text-decoration-none text-primary">
            <i class="bi bi-arrow-left me-1"></i> Back to Log In
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
