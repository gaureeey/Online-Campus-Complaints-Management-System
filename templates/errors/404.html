{% extends 'base.html' %}

{% block title %}Page Not Found | OCMS{% endblock %}

{% block public_content %}
<div class="container py-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-7 col-lg-5">
      <div class="ocms-card p-5 bg-white shadow-sm">
        <div class="rounded-circle bg-warning-subtle text-warning d-inline-flex align-items-center justify-content-center mb-3" style="width: 72px; height: 72px; font-size: 2rem;">
          <i class="bi bi-compass"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">Page Not Found (404)</h2>
        <p class="text-muted small mb-4">The requested page or grievance tracking record could not be found or may have been relocated.</p>
        <div class="d-grid gap-2">
          <a href="{{ url_for('main.index') }}" class="btn btn-primary">
            <i class="bi bi-house-door me-1"></i> Return to Home
          </a>
          <a href="{{ url_for('main.track_public') }}" class="btn btn-light border">
            <i class="bi bi-search me-1"></i> Track Grievance Status
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
