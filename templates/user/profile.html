{% extends 'base.html' %}

{% block title %}My Profile | OCMS{% endblock %}

{% block content %}
<div class="mb-4">
  <h2 class="fw-bold text-dark mb-1">My Profile & Security</h2>
  <p class="text-muted small mb-0">Update your name, contact phone, or change your password.</p>
</div>

<div class="row g-4">
  <!-- Profile Information Form -->
  <div class="col-lg-6">
    <div class="ocms-card p-4">
      <h5 class="fw-bold text-dark mb-3"><i class="bi bi-person me-2 text-primary"></i> Contact Details</h5>
      <form action="{{ url_for('profile') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="update_profile">
        
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" name="name" value="{{ current_user.name }}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Mobile Phone</label>
          <input type="tel" class="form-control" name="phone" value="{{ current_user.phone or '' }}" placeholder="+91 98765 43210">
        </div>

        <div class="mb-4">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control bg-light" value="{{ current_user.email }}" readonly>
          <div class="form-text">Your campus email cannot be changed directly.</div>
        </div>

        <button type="submit" class="btn btn-primary">
          Save Contact Details
        </button>
      </form>
    </div>
  </div>

  <!-- Change Password Form -->
  <div class="col-lg-6">
    <div class="ocms-card p-4">
      <h5 class="fw-bold text-dark mb-3"><i class="bi bi-shield-lock me-2 text-primary"></i> Change Password</h5>
      <form action="{{ url_for('profile') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="action" value="change_password">
        
        <div class="mb-3">
          <label class="form-label">Current Password</label>
          <input type="password" class="form-control" name="current_password" placeholder="••••••••" required>
        </div>

        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" class="form-control" name="new_password" placeholder="At least 8 characters" required minlength="8">
        </div>

        <div class="mb-4">
          <label class="form-label">Confirm New Password</label>
          <input type="password" class="form-control" name="confirm_password" placeholder="Re-enter new password" required minlength="8">
        </div>

        <button type="submit" class="btn btn-light border">
          Update Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
